services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: contextos
      POSTGRES_USER: contextos
      POSTGRES_PASSWORD: contextos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextos -d contextos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - contextos-db:/var/lib/postgresql/data

volumes:
  contextos-db:

